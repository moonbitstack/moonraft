name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: |
          moon check --target all --deny-warn

      - name: moon build
        run: |
          moon build --target all

      - name: moon test
        run: |
          moon test --target all

      # The library (the `moonraft` package and its sub-packages) must keep 100%
      # line coverage. The `examples/` directory holds executable demo programs,
      # not library code, so they are outside the library's coverage obligation
      # and are checked separately by the "runnable examples" step below.
      - name: coverage must be 100%
        if: ${{ runner.os == 'Linux' }}
        run: |
          moon test --enable-coverage
          echo "--- coverage (library only; examples/ are runnable demos, excluded) ---"
          set -o pipefail
          moon coverage report -f summary | tee summary.txt
          lib="$(grep -vE 'examples[\\/]|^Total:' summary.txt)"
          if [ -n "$lib" ]; then
            bad="$(printf '%s\n' "$lib" | grep -oE '[0-9]+/[0-9]+' | awk -F/ '$1 != $2 { c++ } END { print c + 0 }')"
            if [ "${bad:-0}" -ne 0 ]; then
              echo "::error::line coverage is below 100%"; exit 1
            fi
          fi
          echo "library coverage: 100%"

      - name: runnable examples
        run: |
          moon run cmd/example
          moon run examples/00-helloworld
          moon run examples/01-replicate
          moon run examples/02-fault-tolerance
          moon run examples/03-operations
          moon run examples/04-kvstore
          moon run examples/05-membership
          moon run examples/06-learner
          moon run examples/07-checkquorum
          moon run examples/08-snapshot
          moon run examples/09-rawnode
          moon run examples/10-storage
          moon run examples/11-readindex

      - name: lint
        run: |
          moon fmt && git diff --exit-code
          moon info && git diff --exit-code

      - name: API reference must match the generator
        run: |
          node docs/gen-api.mjs
          git diff --exit-code docs/api.html
