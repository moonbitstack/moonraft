name: Check and Test

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: install-unix
        if: ${{ runner.os != 'Windows' }}
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: install-windows
        if: ${{ runner.os == 'Windows' }}
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser; irm https://cli.moonbitlang.com/install/powershell.ps1 | iex
          "C:\Users\runneradmin\.moon\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: post install
        run: |
          moon version --all
          moon update

      - name: moon check
        run: |
          moon check --target all --deny-warn

      - name: moon build
        run: |
          moon build --target all

      - name: moon test
        run: |
          moon test --target all

      - name: coverage must be 100%
        if: ${{ runner.os == 'Linux' }}
        run: |
          moon test --enable-coverage
          moon coverage report -f summary > summary.txt || true
          cat summary.txt
          lib_uncovered="$(grep -vE 'examples[\\/]|^Total:' summary.txt | grep -oE '[0-9]+/[0-9]+' | awk -F/ '$1 != $2' || true)"
          if [ -n "$lib_uncovered" ]; then
            echo "::error::library line coverage is below 100%:"; printf '%s\n' "$lib_uncovered"; exit 1
          fi
          echo "library coverage: 100%"

      - name: examples run
        shell: bash
        run: |
          moon run src/cmd/example
          for dir in src/examples/[0-9]*/; do
            moon run "$dir" > /dev/null
          done

      - name: benchmarks run
        shell: bash
        run: |
          moon run --release src/cmd/benchmark

      - name: lint
        run: |
          moon fmt && git diff --exit-code
          moon info && git diff --exit-code

      - name: API reference must match the generator
        run: |
          node scripts/gen_api.mjs
          git diff --exit-code docs/api.html

      - name: the skills are valid
        if: runner.os == 'Linux'
        run: |
          for dir in docs/skills/*/; do
            case "$dir" in *CHANGE-ME*) continue ;; esac
            [ -f "$dir/SKILL.md" ] || continue
            pipx run --spec skills-ref agentskills validate "$dir"
          done

      # A reader pastes the blocks of the README and the skills into a project, so they have
      # to compile as written, against this commit's source.
      - name: the code in the docs compiles
        if: runner.os == 'Linux'
        run: python3 scripts/check_snippets.py

      - name: the guide shows the code it runs
        if: runner.os == 'Linux'
        run: python3 scripts/check_guide.py
